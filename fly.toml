# fly.toml app configuration file generated for black-hollow-6332 on 2026-08-27T06:41:00-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'black-hollow-6332'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Webhooks are the primary near-real-time signal; REST polling only
  # backstops them, so keep the sweeps hourly to stay well inside the
  # GitHub API rate limit.
  WORKFLOW_POLL_INTERVAL = '1h'
  RUNNER_POLL_INTERVAL = '1h'
  # Log every outgoing GitHub API call with its remaining rate-limit budget,
  # so rate-limit exhaustion can be attributed to a specific sweep.
  GITHUB_API_ACCESS_LOG = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
